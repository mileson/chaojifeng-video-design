<svg xmlns="http://www.w3.org/2000/svg" width="960" height="895" viewBox="0 0 960 895" role="img" aria-labelledby="title desc"><title id="title">音频能力按需准备</title><desc id="desc">按任务选择 Qwen3-TTS、Whisper、ACE-Step 或 HTDemucs，先静态检查已有资源，再按授权补齐缺项、短样验证、校对与时间映射。</desc>
